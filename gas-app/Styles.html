<style>
:root {
  --navy:   #1B3A6B;
  --saffron:#FF6B00;
  --gold:   #F7A800;
  --white:  #ffffff;
  --light:  #f5f7fa;
  --text:   #2d3748;
  --muted:  #718096;
  --border: #e2e8f0;
  --green:  #38a169;
  --red:    #e53e3e;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Segoe UI', Arial, sans-serif; color: var(--text); background: var(--light); }

/* Gov Strip */
.gov-strip {
  background: #fff;
  border-bottom: 3px solid var(--saffron);
  padding: 5px 16px;
  font-size: 11px;
  color: #444;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  font-weight: 600;
}

/* Site Header */
.site-header {
  background: var(--navy);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.site-header img.emblem {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: #fff;
  padding: 3px;
  border: 2px solid var(--gold);
  object-fit: contain;
}
.site-header .htext h1 { color: #fff; font-size: 18px; line-height: 1.3; }
.site-header .htext p  { color: var(--gold); font-size: 12px; }
.site-header .badge {
  margin-left: auto;
  background: var(--saffron);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 20px;
}

/* Nav */
.site-nav {
  background: #152f57;
  padding: 0 24px;
  display: flex;
  gap: 0;
  overflow-x: auto;
}
.site-nav a {
  color: rgba(255,255,255,0.8);
  text-decoration: none;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  transition: all .2s;
}
.site-nav a:hover, .site-nav a.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

/* Ticker */
.ticker {
  background: var(--saffron);
  color: #fff;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  overflow: hidden;
}
.ticker-inner { display: inline-block; animation: ticker 25s linear infinite; }
@keyframes ticker { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

/* Stats bar */
.stats-bar {
  background: var(--navy);
  padding: 16px 24px;
  display: flex;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
}
.stat-item { text-align: center; }
.stat-item .num { color: var(--gold); font-size: 26px; font-weight: 800; line-height: 1; }
.stat-item .lbl { color: rgba(255,255,255,0.7); font-size: 11px; margin-top: 2px; }

/* Section */
.section { padding: 40px 24px; max-width: 960px; margin: 0 auto; }
.section-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 3px solid var(--saffron);
  display: inline-block;
}

/* Cards grid */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  margin-top: 16px;
}
.card {
  background: #fff;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
  border-top: 4px solid var(--navy);
  text-align: center;
}
.card .card-icon { font-size: 32px; margin-bottom: 10px; }
.card h3 { font-size: 15px; color: var(--navy); margin-bottom: 4px; }
.card p  { font-size: 13px; color: var(--muted); }

/* Gallery grid */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}
.gallery-grid img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  border-radius: 6px;
  cursor: pointer;
  transition: transform .2s;
}
.gallery-grid img:hover { transform: scale(1.04); }

/* Principal card */
.principal-card {
  background: #fff;
  border-radius: 10px;
  padding: 24px;
  display: flex;
  gap: 20px;
  align-items: flex-start;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}
.principal-card img {
  width: 90px; height: 110px;
  object-fit: cover;
  border-radius: 6px;
  border: 3px solid var(--navy);
  flex-shrink: 0;
}
.principal-card blockquote {
  font-style: italic;
  color: #444;
  font-size: 14px;
  line-height: 1.7;
  border-left: 3px solid var(--saffron);
  padding-left: 12px;
  margin-bottom: 10px;
}
.principal-card cite { font-size: 13px; font-weight: 700; color: var(--navy); }

/* Footer */
.site-footer {
  background: var(--navy);
  color: rgba(255,255,255,0.7);
  padding: 32px 24px 16px;
  margin-top: 40px;
}
.footer-grid {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 24px;
  margin-bottom: 24px;
}
.footer-grid h4 { color: var(--gold); font-size: 13px; margin-bottom: 10px; text-transform: uppercase; }
.footer-grid a  { color: rgba(255,255,255,0.6); text-decoration: none; display: block; font-size: 12px; margin-bottom: 5px; }
.footer-grid a:hover { color: var(--gold); }
.footer-bottom {
  max-width: 960px; margin: 0 auto;
  border-top: 1px solid rgba(255,255,255,0.1);
  padding-top: 14px;
  font-size: 11px;
  text-align: center;
  color: rgba(255,255,255,0.4);
}

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; transition: all .2s; }
.btn-primary   { background: var(--saffron); color: #fff; }
.btn-primary:hover   { background: #e55f00; }
.btn-secondary { background: var(--navy); color: #fff; }
.btn-secondary:hover { opacity: .85; }
.btn-success   { background: var(--green); color: #fff; }
.btn-danger    { background: var(--red); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn:disabled { background: #ccc; cursor: not-allowed; }

/* Alerts */
.alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin: 10px 0; display: none; }
.alert.show { display: block; }
.alert-error   { background: #fff5f5; color: var(--red);   border: 1px solid #fed7d7; }
.alert-success { background: #f0fff4; color: var(--green); border: 1px solid #c6f6d5; }
.alert-info    { background: #ebf8ff; color: #2b6cb0;      border: 1px solid #bee3f8; }

/* Form */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: 7px;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
  color: var(--text);
  background: #fff;
  font-family: inherit;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--navy); }
.form-textarea { resize: vertical; min-height: 100px; }

/* Table */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { background: var(--navy); color: #fff; padding: 10px 12px; text-align: left; }
.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.data-table tr:hover td { background: #f8fafc; }

/* Badge */
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
.badge-green  { background: #c6f6d5; color: #276749; }
.badge-orange { background: #feebc8; color: #c05621; }
.badge-red    { background: #fed7d7; color: #9b2c2c; }

/* Spinner */
.spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 640px) {
  .site-header { flex-wrap: wrap; }
  .stats-bar { gap: 16px; }
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .section { padding: 24px 16px; }
}
</style>
